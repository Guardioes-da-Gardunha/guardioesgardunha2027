<style>

ystem-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --crest:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif; --serif:'EB Garamond',Georgia,'Times New Roman',serif; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg) var(--contour) center -120px / 1400px auto repeat-y;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--head);font-weight:900;font-stretch:62%;text-transform:uppercase;line-height:.95;text-wrap:balance;margin:0}
h2{font-size:2.6rem} h3{font-size:1.2rem;font-weight:800;font-stretch:75%;letter-spacing:.02em}
a{color:var(--terra-txt)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
header{border-bottom:1px solid var(--line);background:var(--header-bg)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:18px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand small{display:block;font-family:var(--mono);letter-spacing:.08em;font-size:.8rem;color:var(--muted);text-transform:uppercase}
.brand h1{font-family:var(--head);font-size:1.6rem;font-weight:900;font-stretch:62%;letter-spacing:.01em;text-transform:uppercase}
.me{margin-left:auto;font-size:.875rem;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:12px}
nav button{font-family:var(--head);font-weight:700;font-stretch:75%;text-transform:uppercase;letter-spacing:.04em;font-size:.95rem;background:none;border:0;color:var(--muted);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--terra)}
main.wrap{padding-block:28px 64px;display:grid;gap:22px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.lbl{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.big{font-family:var(--head);font-weight:900;font-stretch:62%;font-size:2.4rem;line-height:1}
button.b,label.b{font:inherit;font-weight:700;font-size:.9rem;border-radius:99px;border:1px solid var(--light);background:var(--light);color:var(--on-light);padding:9px 16px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.b.t,label.b.t{background:var(--terra);border-color:var(--terra);color:var(--on-terra);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.04em}
button.b.o,label.b.o{background:transparent;color:var(--ink);border-color:var(--line2)}
button.b.s{padding:5px 12px;font-size:.84rem;min-height:32px}
button.b:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=date],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-height:40px;min-width:0;max-width:100%}
input[type=number]{width:6em}
input[type=checkbox]{accent-color:var(--terra);width:18px;height:18px}
input[type=range]{accent-color:var(--terra)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:99px;overflow:hidden}
.seg button{font:inherit;font-size:.875rem;font-weight:600;border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--light);color:var(--on-light)}
.tag{display:inline-block;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.tag.Subida{background:var(--terra-soft);color:var(--terra-txt)} .tag.Descida{background:var(--surface2);color:var(--ink)}
.tag.Cumeada,.tag.Loop{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--terra-soft);color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:var(--muted);text-align:left;font-weight:400;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,td.r.num{font-family:var(--mono);font-size:.9rem}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.pod1 td:first-child{color:var(--terra-txt);font-weight:800}
tr.me td{background:var(--terra-soft)} tr.me td:first-child{color:var(--terra-txt)}
.pos{font-family:var(--mono);font-size:1rem;width:2.6em;color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.me.click:hover td{background:var(--me-hover)}
tr.hist td{background:var(--bg);font-size:.875rem}
.notice{border:1px solid var(--accent-line);background:var(--terra-soft);padding:12px 14px;border-radius:12px}
.notice.f{border-color:var(--ok);background:var(--ok-soft)}
.notice.w{border-color:var(--warn);background:var(--warn-soft)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--drop-bg)}
.drop.on{border-color:var(--terra);background:var(--terra-soft)}
.map{width:100%;max-width:100%;height:auto;display:block;background:var(--mapbg);border-radius:10px}
.map .trk{fill:none;stroke:var(--track);stroke-width:2;vector-effect:non-scaling-stroke}
.map .ref{fill:none;stroke:var(--light);stroke-width:2.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.map .sel{fill:none;stroke:var(--terra);stroke-width:3.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .st{fill:var(--light)} .map .en{fill:var(--terra)}
.prof{width:100%;height:110px;display:block;background:var(--mapbg);border-radius:10px}
.prof .a{fill:var(--line2)} .prof .s{fill:var(--terra);opacity:.4}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.kv div{display:grid;gap:2px}
.kv strong{font-family:var(--mono);font-weight:600}
.pips{display:inline-flex;gap:3px;vertical-align:middle} .pips i{width:9px;height:9px;border-radius:2px;background:var(--line2)} .pips i.on{background:var(--terra)}
.range{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.range input{width:100%}
.grow{flex:1 1 0;min-width:0;width:0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--light);color:var(--on-light);padding:10px 16px;border-radius:99px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
details>summary{cursor:pointer;font-weight:700}
.fold{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:12px;width:100%;cursor:pointer}.fold h3{margin:0;flex:0 1 auto}.fold .chev{margin-left:auto;font-family:var(--mono);font-size:1.4rem;line-height:1;color:var(--terra-txt)}.fold:focus-visible{outline:2px solid var(--terra);outline-offset:4px;border-radius:4px}
.zm{position:relative;border-radius:10px;overflow:hidden;background:var(--mapbg)}
.zmap{display:block;width:100%;height:clamp(300px,52vh,460px);touch-action:none;cursor:crosshair;user-select:none}
.zmap .trk{fill:none;stroke:var(--track);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.zmap .sel{fill:none;stroke:var(--terra);stroke-width:4.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.zmap .st{fill:var(--ok);stroke:var(--bg);stroke-width:2;vector-effect:non-scaling-stroke} .zmap .en{fill:var(--terra);stroke:var(--bg);stroke-width:2;vector-effect:non-scaling-stroke}
.zm-tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.zm-tools .b{background:var(--glass);min-width:44px;justify-content:center}
.zm-bar{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.8rem;color:var(--muted);pointer-events:none}
.zm-line{display:block;height:6px;border:2px solid var(--muted);border-top:0}
.zm-n{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:.8rem;color:var(--muted);pointer-events:none}
.seg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}.seg .dot.st{background:var(--ok)}.seg .dot.en{background:var(--terra)}
.seg-form{border:1px solid var(--line2);border-radius:10px;padding:16px;background:var(--surface2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* pódio do ranking */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:560px;padding-top:30px}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0;position:relative}
.podium .nm{font-weight:800;font-size:.95rem;overflow-wrap:anywhere}
.podium .tm{font-family:var(--mono);font-weight:600;font-size:.95rem}
.podium .pc{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.podium .blk{width:100%;margin-top:6px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:900;font-stretch:62%}
.podium .p1 .blk{height:116px;background:var(--terra);color:var(--on-terra);font-size:3.4rem}
.podium .p2 .blk{height:80px;background:var(--light);color:var(--on-light);font-size:2.6rem}
.podium .p3 .blk{height:56px;background:var(--line2);color:var(--ink);font-size:2rem}
.podium .p1 .tm,.podium .p1 .pc{color:var(--terra-txt)}
.crown{position:absolute;top:-28px;right:4px;background:var(--light);color:var(--on-light);font-family:var(--mono);font-weight:800;font-size:.75rem;padding:3px 8px;border-radius:99px;transform:rotate(8deg)}
.podbase{height:6px;max-width:560px;background:var(--line2);border-radius:0 0 4px 4px;margin-top:-22px}
.seghead .tagline{color:var(--soft-text);font-size:.95rem}
.lenda{max-width:64ch;display:grid;gap:14px;font-family:var(--serif);font-size:1.22rem;line-height:1.65;color:var(--soft-text)}
.lenda h3{font-family:var(--head);font-weight:900;font-stretch:62%;text-transform:uppercase;letter-spacing:.01em;font-size:2rem;color:var(--terra-txt);margin-top:16px}
.lenda > p:first-of-type::first-letter{font-family:var(--head);font-weight:900;font-stretch:62%;float:left;font-size:4.4rem;line-height:.82;padding:6px 10px 0 0;color:var(--terra)}
.lenda p{margin:0}
.lenda strong{color:var(--ink);font-weight:500}
.lenda .fim{font-family:var(--head);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:1.8rem;line-height:1.1;letter-spacing:.01em;color:var(--ink);margin-top:12px}
.crest-title{font-family:var(--head)!important;font-weight:900!important;font-stretch:62%!important;letter-spacing:.01em;text-transform:uppercase!important}
@media (max-width:560px){ .wrap{padding-inline:16px} h2{font-size:2.1rem} .brand h1{font-size:1.3rem} td,th{padding:9px 8px} .podium .p1 .blk{height:96px;font-size:2.8rem} }

.codebox{font-family:var(--mono);font-size:clamp(1.4rem,6vw,2rem);letter-spacing:.08em;padding:14px 16px;border:1px dashed var(--terra);border-radius:10px;background:var(--terra-soft);color:var(--terra-txt);text-align:center;user-select:all;-webkit-user-select:all;word-break:break-all}
.linkb{background:none;border:0;padding:6px 0;color:var(--muted);font:inherit;font-size:.875rem;text-decoration:underline;cursor:pointer}
.site-foot{padding-block:28px 40px;color:var(--muted);display:grid;gap:10px}
.disc{margin:0;font-family:var(--serif);font-style:italic;font-size:.95rem;line-height:1.5;color:var(--soft-text);max-width:60ch;border-left:2px solid var(--terra);padding-left:12px}

/* navegação no telemóvel: barra de ícones em baixo + deslizar */
html,body{overflow-x:clip;max-width:100%;touch-action:pan-y} main,.wrap,.card{min-width:0;max-width:100%}
.bnav{display:none}
@keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}} @keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
main.in-r{animation:inR .22s ease} main.in-l{animation:inL .22s ease}
@media (prefers-reduced-motion: reduce){ main.in-r,main.in-l{animation:none} }
@media (max-width:999px){
  nav#tabs button.pub{display:none} nav#tabs:not(:has(.adm)){display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--header-bg);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .bnav button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:3px;font:600 .7rem/1.1 var(--body);padding:4px 0 2px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
  .bnav button[aria-current="page"]{color:var(--terra-txt)}
  .bnav button[aria-current="page"]::before{content:'';position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--terra)}
  main.wrap{padding-bottom:28px} .site-foot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#me[hidden]{display:none}
/* início */
.hero{display:grid;gap:12px;justify-items:start;padding-block:8px 4px}
.hero .crest svg{width:76px;height:76px}
.hero h2{font-size:clamp(2.3rem,9vw,4rem)}
.hero .claim{font-family:var(--head);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:clamp(1.3rem,4.5vw,1.8rem);color:var(--terra-txt);letter-spacing:.03em;margin:0}
.hero .when{font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .stats div{display:grid;gap:2px;border-left:2px solid var(--terra);padding-left:10px} .stats strong{font-family:var(--head);font-weight:900;font-stretch:62%;font-size:1.9rem;line-height:1} .stats span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
/* cartões dos caminhos */
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:min(86%,340px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.scard{scroll-snap-align:center;text-align:left;font:inherit;color:inherit;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;cursor:pointer;min-width:0}

/* ---------- DOM ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){ const v = props[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(9)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids){ const e = document.createElementNS(NS, tag); for (const k in attrs||{}) e.setAttribute(k, attrs[k]); for (const c of kids) if (c) e.append(c); return e; }
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 3800); }
const pad2 = n => String(n).padStart(2,'0');
const ageIn2027 = nasc => { const y = parseInt(String(nasc||'').slice(0,4), 10); return isFinite(y) && y > 1900 ? 2027 - y : null; };

function fpOf(act){ // impressão digital da atividade: o mesmo ficheiro dá sempre o mesmo valor
  const P = act.pts, a = P[0], b = P[P.length-1], m = P[P.length>>1];
  const str = [P.length, a.t, b.t, a.lat.toFixed(5), a.lon.toFixed(5), m.lat.toFixed(5), m.lon.toFixed(5), b.lat.toFixed(5), b.lon.toFixed(5)].join('|');
  let x = 2166136261; for (let i=0;i<str.length;i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return (x>>>0).toString(16).padStart(8,'0');
}
function fpOwner(fp){
  for (const [uid, d] of Object.entries(S.eff)) if (d.fp && d.fp[fp]) return {src:'u:'+uid, at:d.fp[fp]};

}

const srcOf = t => t.kind === 'u' ? 'u:' + t.uid : 'm:' + t.aid;
function sameAsOther(r, mySrc){ // o mesmo tempo, à décima, no mesmo instante, noutro atleta
  const chk = (src, d) => src !== mySrc && ((d.h||{})[String(r.s)]||[]).some(x => Math.abs(x.st - r.st) <= 2 && Math.abs(x.t - r.t) <= 0.5);
  for (const [uid, d] of Object.entries(S.eff)) if (chk('u:'+uid, d)) return true;
  for (const [aid, d] of Object.entries(S.man)) if (chk('m:'+aid, d)) return true;
  return false;
}
const fmtDate = st => { const d = new Date(st*1000); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; };
const fmtDT = st => { const d = new Date(st*1000); return fmtDate(st) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const km = m => (m/1000).toLocaleString('pt-PT',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' km';
const kmh = (len, t) => { if (!len || !t) return '—'; const p = Math.round(t / (len/1000)); return Math.floor(p/60) + ':' + pad2(p%60) + ' /km'; }; // ritmo (pace)
function pips(n){ return h('span',{class:'pips', title:'Nível '+n+' de 5'}, [1,2,3,4,5].map(i=>h('i',{class:i<=n?'on':''}))); }

/* ---------- derivados ---------- */
const cfg = () => Object.assign({}, DEF, S.cfg, {mod:'c'}); // o desafio é só de corrida
const athById = id => S.ath.find(a => a.id === id);

/* Localidades: nomes simples, sem uniões de freguesias. Concelho do Fundão (freguesias e aldeias) + São Vicente da Beira e Louriçal do Campo (Castelo Branco) + lugares da serra. */
const LOCS = ['Alcaide','Alcaria','Alcongosta','Aldeia de Joanes','Aldeia Nova do Cabo','Alpedrinha','Atalaia do Campo','Barroca','Bogas de Baixo','Bogas de Cima','Capinha','Casal da Serra','Castelejo','Castelo Novo','Donas','Enxames','Fatela','Fundão','Janeiro de Cima','Lavacolhos','Louriçal do Campo','Mata da Rainha','Orca','Pêro Viseu','Póvoa de Atalaia','São Vicente da Beira','Silvares','Soalheira','Souto da Casa','Telhado','Torre','Três Povos','Vale de Prazeres','Valverde'].sort((a,b)=>a.localeCompare(b,'pt'));
const FREGS = LOCS;
const norm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const segByN = n => S.segs.find(s => s.n === n);

function ownerOf(aid){ // dono efetivo de uma inscrição: confirmado pela organização, senão o primeiro pedido não rejeitado
  const a = athById(aid); if (!a) return null; if (a.uid) return a.uid;
  let best = null; for (const [uid, c] of Object.entries(S.claims)) { if (c.aid !== aid || (a.block||[]).includes(uid)) continue; if (!best || c.at < best.at) best = {uid, at:c.at}; }
  return best ? best.uid : null;
}
function myAid(){ if (!S.uid) return null; for (const a of S.ath) if (ownerOf(a.id) === S.uid) return a.id; return null; }
function inPeriod(st){ const c = cfg(); if (!c.periodOn) return true; const a = Date.parse(c.from+'T00:00:00')/1000, b = Date.parse(c.to+'T23:59:59')/1000; return (!isFinite(a) || st >= a) && (!isFinite(b) || st <= b); }
function effList(){
  const out = [];

    for (const [src, doc] of srcs) for (const [sn, arr] of Object.entries(doc.h || {})) for (const x of arr || []) {

    for (const [sn, arr] of Object.entries(per)) { arr.sort((p,q)=>p.st-q.st); out.push({a:a.id, s:+sn, all:arr, h:arr.filter(x => !x.rj && !x.out)}); }
  }
  return out;
}
function status(x){ if (x.rj) return ['bad','rejeitada']; if (x.out) return ['warn','fora do período']; if (x.fl && !x.ap) return ['warn','em revisão']; if (x.fl && x.ap) return ['ok','aprovada']; return null; }

/* ---------- desenho ---------- */
function flagIcon(x, y, fin){ // partida: bandeira lisa; meta: bandeira axadrezada. A base do mastro fica no ponto exato.
  const g = sv('g',{transform:`translate(${x} ${y})`, class: fin ? 'flag fin' : 'flag st'});
  g.append(sv('circle',{cx:0, cy:0, r:3, fill:'var(--ink)', stroke:'var(--bg)', 'stroke-width':1}), sv('line',{x1:0, y1:0, x2:0, y2:-32, stroke:'var(--ink)', 'stroke-width':2, 'stroke-linecap':'round'}));
  if (!fin) g.append(sv('path',{d:'M1 -32 H23 L18 -24 L23 -16 H1 Z', fill:'var(--ok)', stroke:'var(--ink)', 'stroke-width':1.2, 'stroke-linejoin':'round'}));
  else { for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) g.append(sv('rect',{x:1 + c*6, y:-32 + r*6, width:6, height:6, fill:(r + c) % 2 ? 'var(--bg)' : 'var(--ink)'}));
    g.append(sv('rect',{x:1, y:-32, width:24, height:18, fill:'none', stroke:'var(--ink)', 'stroke-width':1.2})); }
  const t = sv('title',{}); t.textContent = fin ? 'Meta' : 'Partida'; g.append(t); return g;
}
function mapSVG(layers, opts){ // layers: [{xy:[[x,y]..], cls}] em metros locais
  const W = (opts&&opts.w)||600, H = (opts&&opts.h)||300, P = 14;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const L of layers) for (const [x,y] of L.xy){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`, class:'map', role:'img', 'aria-label':(opts&&opts.label)||'Mapa do traçado'});
  if (!isFinite(x0)) return svg;
  const fl = layers.some(l => l.ends), TP = fl ? 40 : P, RP = fl ? 30 : P, aw = W-P-RP, ah = H-P-TP;
  const k = Math.min(aw/Math.max(x1-x0,1), ah/Math.max(y1-y0,1));
  const ox = P + (aw - (x1-x0)*k)/2, oy = P + (ah - (y1-y0)*k)/2;
  const X = x => (ox + (x-x0)*k).toFixed(1), Y = y => (H - oy - (y-y0)*k).toFixed(1);
  for (const L of layers){
    if (L.xy.length < 2) continue;
    const step = Math.max(1, Math.floor(L.xy.length/1500));
    let d = ''; for (let i=0;i<L.xy.length;i+=step) d += (i?'L':'M') + X(L.xy[i][0]) + ' ' + Y(L.xy[i][1]);
    const last = L.xy[L.xy.length-1]; d += 'L' + X(last[0]) + ' ' + Y(last[1]);
    svg.append(sv('path',{d, class:L.cls}));
    if (L.ends){ svg.append(flagIcon(+X(L.xy[0][0]), +Y(L.xy[0][1]), false), flagIcon(+X(last[0]), +Y(last[1]), true)); }
  }
  // escala
  const m = [50,100,200,500,1000,2000].find(v => v*k > 60) || 2000; const bx = W-P-m*k, by = H-P;
  svg.append(sv('path',{d:`M${bx.toFixed(1)} ${by} h${(m*k).toFixed(1)}`, stroke:'var(--muted)', 'stroke-width':2}));
  const t = sv('text',{x:(bx).toFixed(1), y:by-5, fill:'var(--muted)', 'font-size':11, 'font-family':'Karla, sans-serif'}); t.textContent = m >= 1000 ? (m/1000)+' km' : m+' m'; svg.append(t);
  return svg;
}
const segXY = s => C.tracePoly(s.trace);

/* ---------- escrita ---------- */
async function safe(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){ console.error(e); const c = e && e.code;
    toast(c === 'quota_exceeded' ? 'A base de dados está cheia — apaga dados antigos.' : (c === 'invalid_argument' || c === 'permission_denied') ? 'Sem permissão para esta alteração.' : c === 'rate_limited' ? 'Demasiadas tentativas. Espera um pouco e tenta outra vez.' : c === 'no_registration' ? 'Primeiro tens de fazer a inscrição.' : 'Não foi possível guardar. Tenta outra vez.'); return false; }
}
function attemptsDocPath(target){ return target.kind === 'm' ? 'manual/' + target.aid : 'efforts/' + target.uid; }
async function saveAttempts(target, rows){
  const ref = S.db.doc(attemptsDocPath(target)); const snap = await ref.get();
  const body = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {}; body.h = body.h || {};
  let added = 0;
  for (const r of rows){ const k = String(r.s); const arr = body.h[k] = body.h[k] || [];
    if (arr.some(x => Math.abs(x.st - r.st) < 3)) continue;
    const o = {t:r.t, st:r.st, mod:r.mod, len:Math.round(r.len), up:Math.round(Date.now()/1000)}; if (r.hr) o.hr = r.hr; if (r.fl) o.fl = r.fl; if (r.f) o.f = r.f.slice(0,60); if (r.fp) { o.fp = r.fp; body.fp = body.fp || {}; body.fp[r.fp] = Math.round(Date.now()/1000); }
    arr.push(o); added++; }
  if (target.kind === 'm') body.aid = target.aid;
  if (JSON.stringify(body).length > 250000) throw {code:'quota_exceeded'};
  await ref.set(body); return added;
}
async function deleteAttempt(src, sn, st){
  const path = src.startsWith('m:') ? 'manual/' + src.slice(2) : 'efforts/' + src.slice(2);
  const ref = S.db.doc(path); const snap = await ref.get(); if (!snap.exists) return;
  const body = JSON.parse(JSON.stringify(snap.data())); body.h[sn] = (body.h[sn]||[]).filter(x => x.st !== st); if (!body.h[sn].length) delete body.h[sn];
  await ref.set(body);
}
async function setReview(key, kind){ // kind: 'ok' | 'no' | null
  const ok = Object.assign({}, S.rev.ok), no = Object.assign({}, S.rev.no); delete ok[key]; delete no[key];
  if (kind === 'ok') ok[key] = 1; if (kind === 'no') no[key] = 1;
  await S.db.doc('review/main').set({ok, no});
}

const FMT_D = iso => { const [y, m, d] = String(iso||'').split('-').map(Number); return d ? d + ' de ' + MESES[m-1] + (y ? ' de ' + y : '') : ''; };

async function inflateRaw(u8){

  const mySrc = tgt ? srcOf(tgt) : 'preview', seen = new Set(S.pending.map(it => it.fp).filter(Boolean));
  for (const f of files){
    const item = {f:f.name, rows:[], err:null};
    try {
      const act = await readActivity(f);
      if (act.pts.length < 10) item.err = 'Não foi possível ler pontos neste ficheiro.';
      else if (act.pts.some(p => p.t == null)) item.err = 'O GPX não tem horas nos pontos — exporta a atividade original (não uma rota).';
      else {
        const ty = (act.type||'').toLowerCase(), mod = 'c';
        item.mod = mod; item.date = act.pts[0].t; item.name = act.name;
        if (/ride|cycl|bik|gravel|btt|^1$/.test(ty)) { item.err = 'Esta atividade está registada como bicicleta — o desafio é só de corrida.'; res.push(item); continue; }
        const fp = fpOf(act), prev = fpOwner(fp); item.fp = fp;
        if (seen.has(fp)) { item.err = 'Ficheiro repetido: já está na lista acima.'; res.push(item); continue; }
        seen.add(fp);
        if (prev && tgt && prev.src === mySrc) { item.err = `Esta atividade já foi submetida a ${fmtDate(prev.at)}. O mesmo ficheiro só conta uma vez.`; res.push(item); continue; }
        if (prev && tgt) { item.err = 'Esta atividade já foi submetida por outro atleta. Se é tua, fala com a organização.'; res.push(item); continue; }
        for (const sg of segs){
          for (const p of C.detectSegment(act, sg.trace, {R:c.R})){
            const r = {s:sg.n, t:p.t, st:p.st, hr:p.hr, len:p.len, mod, fl:C.suspicion(p, sg, mod, c), f:f.name, fp, out:!inPeriod(p.st), use:inPeriod(p.st)};
            if (!r.fl && sameAsOther(r, mySrc)) r.fl = 'tempo igual ao de outro atleta';

    } catch(e){ console.error(e); item.err = e && e.message && /ZIP|navegador|FIT|compressão/.test(e.message) ? e.message : 'Ficheiro inválido.'; }
    res.push(item);

/* Verificações da organização: avisos sobre dados em falta ou incoerentes */
function orgChecks(){
  const out = [], c = cfg(), A = (lvl, txt, act) => out.push({lvl, txt, act});
  const segs = S.segs.slice().sort((a, b) => a.n - b.n);
  if (!segs.length) A('bad', 'Ainda não há caminhos publicados.');
  const nm = sg => pad2(sg.n) + ' · ' + sg.nome;
  const semTr = segs.filter(sg => !hasTrace(sg)); if (semTr.length) A('bad', `${semTr.length} caminho(s) sem traçado de referência (não são detetados nos GPX): ` + semTr.slice(0, 6).map(x => pad2(x.n)).join(', ') + (semTr.length > 6 ? '…' : ''), 'seg');
  const semAlt = segs.filter(sg => hasTrace(sg) && !segProfile(sg)); if (semAlt.length) A('warn', `${semAlt.length} caminho(s) com traçado mas sem altitude: ` + semAlt.slice(0, 6).map(x => pad2(x.n)).join(', ') + (semAlt.length > 6 ? '…' : '') + '. Usa o botão “Altitude” na lista.', 'seg');
  const semLoc = segs.filter(sg => !sg.localidade); if (semLoc.length) A('warn', `${semLoc.length} caminho(s) sem localidade: ` + semLoc.slice(0, 6).map(x => pad2(x.n)).join(', '), 'seg');
  const locEstr = segs.filter(sg => sg.localidade && !LOCS.includes(sg.localidade)); if (locEstr.length) A('info', 'Localidade fora da lista oficial (confirma a grafia): ' + locEstr.slice(0, 5).map(x => pad2(x.n) + ' “' + x.localidade + '”').join('; '), 'seg');
  const semGpx = segs.filter(sg => !sg.gpxLink); if (semGpx.length && segs.length) A('info', `${semGpx.length} caminho(s) sem link para descarregar o GPX.`, 'seg');
  const curtos = segs.filter(sg => sg.dist && sg.dist < 1000); if (curtos.length) A('warn', 'Caminhos com menos de 1 km: o erro do GPS pesa muito no tempo. ' + curtos.map(x => pad2(x.n)).join(', '), 'seg');
  // dificuldade guardada vs calculada
  for (const sg of segs){ const calc = C.nivelSub(sg.tipo, sg.dist, sg.desn); if (calc != null && sg.nivel && Math.abs(calc - sg.nivel) >= 1)
    A(Math.abs(calc - sg.nivel) >= 2 ? 'bad' : 'warn', `Caminho ${nm(sg)}: dificuldade guardada “${NIVEIS[sg.nivel - 1]}”, mas pela distância e desnível (${km(sg.dist)}, ${Math.round(sg.desn)} m, ${Math.round((sg.incl||0)*100)}%) seria “${NIVEIS[calc - 1]}”.`, {fix:sg.n, nivel:calc}); }
  // pares com o mesmo GPX
  const bySrc = {}; segs.forEach(sg => { if (sg.traceSrc) (bySrc[sg.traceSrc] = bySrc[sg.traceSrc] || []).push(sg); });
  for (const [src, L] of Object.entries(bySrc)) if (L.length > 1){ const ns = L.map(x => x.nivel || 0);
    const par = L.length === 2 && L.some(x => x.tipo === 'Subida') && L.some(x => x.tipo === 'Descida');
    if (!par) A('warn', `Caminhos ${L.map(x => pad2(x.n)).join(' e ')} vêm do mesmo ficheiro (${src}) e não são um par subida/descida. Confirma que não é um engano.`, 'seg');
    else if (Math.max(...ns) - Math.min(...ns) >= 2) A('warn', `Par ${L.map(x => pad2(x.n)).join('/')} (mesmo trilho, sentidos opostos): dificuldades muito diferentes (${L.map(x => x.dif).join(' vs ')}). Verifica.`, 'seg'); }
  const ns = segs.map(x => x.n); for (let i = 1; i <= Math.max(0, ...ns); i++) if (!ns.includes(i)){ A('info', `Falta o caminho n.º ${pad2(i)} na numeração.`, 'seg'); break; }
  // configuração
